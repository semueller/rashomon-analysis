[project]
name = "rashomon-analysis"
version = "0.1.0.dev0"
description = "Analyses of Rashomon sets and their explanations (reads rashomon-zoo output)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sebastian R. Müller" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "rashomon-zoo[shap,lime]",
    "cfire",
]

[tool.uv.sources]
rashomon-zoo = { git = "https://github.com/semueller/rashomon-zoo", branch = "main" }
cfire = { git = "https://github.com/semueller/CFIRE", branch = "main" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rashomon_analysis"]
